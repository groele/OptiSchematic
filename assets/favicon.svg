<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40A9FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Lens body -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#g1)" stroke-width="3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
  <!-- Light rays -->
  <line x1="4" y1="32" x2="16" y2="32" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="22" x2="16" y2="28" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="4" y1="42" x2="16" y2="36" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Converged rays -->
  <line x1="48" y1="32" x2="60" y2="32" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="28" x2="60" y2="22" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="36" x2="60" y2="42" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Focus point -->
  <circle cx="54" cy="32" r="2.5" fill="#FF6B35"/>
</svg>
